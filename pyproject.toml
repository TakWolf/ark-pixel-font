[project]
name = "ark-pixel-font"
version = "0.0.0"
requires-python = ">=3.15"

dependencies = [
    "pixel-font-builder==0.0.62",
    "pixel-font-knife==0.0.34",
    "unicodedata2==18.0.0",
    "unidata-blocks==18.0.0",
    "unicode-block-translations==18.0.0",
    "character-encoding-utils==0.0.13",
    "pyyaml==6.0.3",
    "pillow==13.0.0",
    "beautifulsoup4==4.15.0",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "cyclopts==5.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
