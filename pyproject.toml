[project]
name = "ark-pixel-font"
version = "0.0.0"
requires-python = ">=3.14"

dependencies = [
    "pixel-font-builder==0.0.61",
    "pixel-font-knife==0.0.31",
    "unicodedata2==18.0.0",
    "unidata-blocks==0.0.27",
    "character-encoding-utils==0.0.12",
    "pyyaml==6.0.3",
    "pillow==12.3.0",
    "beautifulsoup4==4.15.0",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "cyclopts==5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
