name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Test
        run: uv run -m pytest
